# Ruff configuration for code quality checks

[tool.ruff]
line-length = 100
target-version = "py39"

select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "UP",     # pyupgrade
]

ignore = [
    "E501",   # line too long (handled by black)
    "W503",   # line break before binary operator
]

exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["F401", "F403"]
